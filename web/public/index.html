<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deck Builder</title>
    <link rel="icon" type="image/png" href="/tabimage_1.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-1: #f9f7f1;
        --bg-2: #d5e8d4;
        --ink: #1f2933;
        --card: rgba(255, 255, 255, 0.82);
        --line: #cad3de;
        --accent: #0f766e;
        --accent-hover: #23b3a7;
        --accent-press: #0b5b54;
        --danger: #b42318;
        --toggle-on: #0f766e;
        --toggle-off: #d8dee6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Space Grotesk', 'Trebuchet MS', 'Gill Sans', sans-serif;
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 15%, rgba(15, 118, 110, 0.22), transparent 28%),
          radial-gradient(circle at 88% 12%, rgba(180, 35, 24, 0.14), transparent 24%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
        padding: clamp(1rem, 2vw, 2rem);
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          linear-gradient(rgba(249, 247, 241, 0.2), rgba(213, 232, 212, 0.24)),
          url('/background_1.png') center center / cover no-repeat;
        opacity: 0.18;
        filter: saturate(0.9) contrast(1.02);
        pointer-events: none;
        z-index: 0;
      }

      .card {
        max-width: 1080px;
        margin: 0 auto;
        background: var(--card);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 16px;
        padding: clamp(1rem, 2.4vw, 2rem);
        box-shadow: 0 14px 40px rgba(15, 23, 42, 0.18);
        position: relative;
        z-index: 1;
      }

      h1 {
        margin: 0;
        letter-spacing: 0.02em;
      }

      .subhead {
        margin-top: 0.4rem;
        color: #445566;
      }

      #themeRows {
        margin-top: 1rem;
        display: grid;
        gap: 0.85rem;
      }

      .theme-row {
        display: grid;
        grid-template-columns: minmax(180px, 1.2fr) minmax(180px, 1fr) minmax(180px, 1fr) auto auto;
        gap: 0.6rem;
        align-items: end;
        padding: 0.8rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.7);
      }

      label {
        display: block;
        font-size: 0.92rem;
      }

      select,
      button {
        width: 100%;
        min-height: 42px;
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 0.55rem 0.65rem;
        margin-top: 0.4rem;
        font: inherit;
      }

      button {
        border: none;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        transition: transform 120ms ease, background-color 500ms ease, box-shadow 500ms ease;
        box-shadow: 0 6px 14px rgba(15, 118, 110, 0.18);
      }

      button:hover {
        background: var(--accent-hover);
        box-shadow: 0 10px 24px rgba(35, 179, 167, 0.28);
      }

      button:active {
        transform: translateY(1px);
        background: var(--accent-press);
      }

      .row-controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 220px));
        justify-content: space-between;
        align-items: start;
        gap: 0.6rem;
        margin-top: 0.9rem;
      }

      .row-controls button {
        width: 220px;
        margin-top: 0;
      }

      .include-toggle {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-top: 0.2rem;
        padding-bottom: 0.5rem;
      }

      .toggle-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .toggle-shell {
        position: relative;
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        width: 108px;
        padding: 4px;
        border-radius: 999px;
        background: var(--toggle-off);
        border: 1px solid var(--line);
        cursor: pointer;
        user-select: none;
      }

      .toggle-shell::before {
        content: '';
        position: absolute;
        top: 4px;
        left: 4px;
        width: calc(50% - 4px);
        height: calc(100% - 8px);
        border-radius: 999px;
        background: var(--toggle-on);
        box-shadow: 0 4px 10px rgba(15, 118, 110, 0.25);
        transition: transform 220ms ease, background-color 500ms ease;
      }

      .toggle-input:not(:checked) + .toggle-shell::before {
        transform: translateX(100%);
        background: #768396;
        box-shadow: 0 4px 10px rgba(93, 103, 117, 0.2);
      }

      .toggle-option {
        position: relative;
        z-index: 1;
        text-align: center;
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: lowercase;
        padding: 0.35rem 0;
        color: #5b6778;
      }

      .toggle-input:checked + .toggle-shell .toggle-option-on {
        color: #ffffff;
      }

      .toggle-input:checked + .toggle-shell .toggle-option-off {
        color: #5b6778;
      }

      .toggle-input:not(:checked) + .toggle-shell .toggle-option-on {
        color: #5b6778;
      }

      .toggle-input:not(:checked) + .toggle-shell .toggle-option-off {
        color: #ffffff;
      }

      .remove-btn {
        background: #fff;
        color: var(--danger);
        border: 1px solid #f1c6bf;
      }

      .remove-btn:hover {
        background: #ffe9e6;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #102437;
        color: #e8f0f8;
        padding: 1rem;
        border-radius: 10px;
      }

      .warning {
        color: #ad6d00;
        margin-top: 1rem;
      }

      @media (max-width: 980px) {
        .theme-row {
          grid-template-columns: 1fr;
        }

        .row-controls {
          grid-template-columns: 1fr;
        }

        .row-controls button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Deck Builder</h1>
      <p class="subhead">Pick themes first, then commander choices auto-populate per theme.</p>

      <div id="themeRows"></div>
      <div class="row-controls">
        <button id="addThemeBtn" type="button">Add Theme Row</button>
        <button id="buildBtn">Build Deck</button>
        <button id="copyBtn" type="button">Copy Result</button>
      </div>

      <div id="warningBox" class="warning"></div>
      <h2>Result</h2>
      <pre id="result">Waiting for build...</pre>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
